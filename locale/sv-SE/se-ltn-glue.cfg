[mod-name]
se-ltn-glue=Space Exploration - LTN integration

[mod-description]
se-ltn-glue=Gör det möjligt för LTN att leverera genom rymdhissen i SE

[mod-setting-name]
se-ltn-use-elevator-clearance=Använd utfartsstation
se-ltn-elevator-clearance-name=Namn på utfartsstation

[mod-setting-description]
se-ltn-use-elevator-clearance=Tåg som lämnar en hiss och åker direkt till en destination med en återstående tåggräns på 1 kommer att rycka fram och visa meddelandet ”[color=purple]Destinationen är full[/color]”. För att undvika detta kan tåget först åka till en utfartsstationen.\nEn sådan station får [color=cyan]inte ha någon tåggräns[/color] och måste ligga minst [color=cyan]en hel tåglängd bort[/color] från utfartspunkten inne i hissen.\n\nDen här inställningen lägger till sådana stationer i varje LTN-leverans som går genom en hiss. Nästa inställning anger namnet på alla dessa stationer.\n\nEftersom LTN:s beställare och leverantörer sällan har tåggränser i Factorio är funktionen främst användbar för depåer med tåggräns.

[se-ltn-glue-message]
re-assign-delivery=[SE-LTN] __1__ anlände genom en hiss.
elevator-disconnected=[SE-LTN] Kopplade bort hissen __1__ från LTN.
elevator-connected=[SE-LTN] Anslöt hissen __1__ till LTN.
elevator-connected-masked=[SE-LTN] Anslöt hissen __1__ till LTN-nätverken __2__.
cross-surface-delivery=[SE-LTN] Leverans mellan ytor för __1__, matchande förbindelser mellan ytor: __2__.
requester-delivery-reset-should-be-disabled=[img=virtual-signal/se-warning] [color=yellow][SE-LTN] LTN-inställningen ”__1__” är aktiverad. Det hindrar tåg från att återvända till ytan de ursprungligen kom från, vilket med tiden tömmer ytan med färre beställningar på tåg och kan överfylla depåerna på den andra ytan.[/color]

[se-ltn-ui-tooltip]
network-id=Kodade LTN-nätverks-ID:n som tillåts passera genom den här hissen.

