[mod-setting-description]
ltn-interface-console-level=Detaljnivå för meddelanden i spelet.\n\n0: Av\nInga meddelanden skapas.\n\n1: Fel och varningar\nVisa endast fel och varningar.\n\n2: Meddelanden (standard)\nVisa grundläggande information, exempelvis om saknade resurser eller skapade leveranser.\n\n3: Detaljerade meddelanden\nVisa detaljerad information om sökningen efter leverantörer och tåg.
ltn-interface-factorio-alerts=Visa fel och varningar som Factorio-varningar
ltn-interface-debug-logfile=Skriv felsökningsinformation till /Factorio/factorio-current.log.
ltn-dispatcher-enabled=Varning: Om trafikledningen inaktiveras skapas inga leveranser.\nFöremålsmängderna övervakas fortfarande.
ltn-dispatcher-nth_tick=Hur ofta stopp och beställningar uppdateras.\nHögre värden förbättrar prestandan genom att sprida uppdateringarna över fler tick.\nOm värdet är > 1 tvingas Uppdateringar per tick till 1.
ltn-dispatcher-updates-per-tick=Begränsar antalet stopp och beställningar som uppdateras per tick.\nLägre värden förbättrar prestandan.\nIgnoreras när Uppdateringsintervall > 1.
ltn-dispatcher-requester-threshold=Saknad mängd föremål eller vätska som utlöser en leverans.\nKan åsidosättas med en signal vid beställarstopp.\nstandard = 1000
ltn-dispatcher-provider-threshold=Mängd föremål eller vätska som krävs för att fungera som leverantör.\nKan åsidosättas med en signal vid leverantörsstopp.\nstandard = 1000
ltn-dispatcher-schedule-circuit-control=Lägger till kretsvillkor vid alla stopp för att invänta röd = 0 ELLER grön ≥ 1.\nVarning: Alla LTN-stopp måste ha ”skicka till tåg” aktiverat och vara anslutna till kretsnätverket. Annars blir tågen stående och väntar för alltid.\nstandard = false
ltn-dispatcher-depot-inactivity=Antal sekunder av inaktivitet innan tåg lämnar depån.\nstandard = 5
ltn-dispatcher-stop-timeout=Antal sekunder innan tåg tvingas lämna en station.\n0 inaktiverar funktionen.\nstandard = 120
ltn-dispatcher-delivery-timeout=Antal sekunder en leverans får ta innan tåget antas vara förlorat.\nstandard = 600 (10 min)
ltn-dispatcher-requester-delivery-reset=Falskt (standard):\nLeveransen och tågschemat återställs när tåget anländer till depån.\nÄndringar av tåg som står vid beställarstopp har ingen effekt.\n\nSant:\nLeveransen och tågschemat återställs när tåget lämnar beställaren.\nÄndringar av tåg som står vid beställarstopp tar bort leveransen och återställer tågschemat.
ltn-dispatcher-finish-loading=Sant (standard):\nFörhindrar att tåg avgår medan lastkranar eller pumpar arbetar genom att lägga till ett villkor om 2 sekunders inaktivitet.\n\nFalskt:\nTågen avgår omedelbart när alla föremål har lastats.\nLastkranar vid lastningsstationer blir stående.
ltn-depot-reset-filters=Sant (standard):\nGodsvagnarnas filter och stapelbegränsningar rensas när vagnarna kommer in i en depå.
ltn-depot-fluid-cleaning=Största mängd vätska per vagn som förstörs automatiskt när vagnen kommer in i en depå.\nAnge 0 för att inaktivera eller -1 för att ta bort allt.
ltn-stop-default-network=Nätverks-ID som används för stopp utan signalen ”Kodat nätverks-ID”.
ltn-provider-show-existing-cargo=Sant (standard):\nLasten som redan finns i tåget när det anländer till leverantören visas i LTN-utgången.\nDetta omfattar föremål som hålls av lastkranar ovanför spåren.
ltn-provider-ignore-stopped-train=Sant (standard):\nIgnorera ett stillastående tåg vid beställarstoppet när lasten till beställaren beräknas.
ltn-schedule-fuel-station=Aktivera bränslepåfyllning av tåg vid bränslestationer.\nSkickar tåg för bränslepåfyllning om de har ont om bränsle och det finns en bränslestation i deras aktuella nätverk.
ltn-schedule-reset-interrupts=Ta bort alla avbrott i tågschemat när tåget når en depå.
ltn-schedule-reselect-depot=(Den här inställningen har ingen effekt om ”Leveransen avslutas hos beställaren” är falskt.) När den är aktiverad väljs depån som tåget ska åka till på nytt.
ltn-fuel-station-interrupt=När inställningen är aktiverad används ett tågavbrott i Factorio för att skicka ett tåg för bränslepåfyllning. Detta är standard och bör bara ändras om avbrottet orsakar problem. När inställningen är inaktiverad ändrar LTN tågets schema dynamiskt för att skicka det för bränslepåfyllning. Det kräver fler beräkningscykler men ger bättre kontroll över bränslepåfyllningen (till exempel skickas tåget inte för bränslepåfyllning när det anländer till ett tillfälligt stopp).
ltn-advanced-cross-surface-delivery=När inställningen är aktiverad väljer LTN tåg från andra ytor för att utföra leveranser eller skickar först tåg till andra ytor för att hämta laster. Aktivera endast om ditt nätverk sträcker sig över flera ytor som är sammankopplade (exempelvis genom rymdhissen i Space Exploration).
ltn-depot-fudge-factor=Största skillnad i avstånd mellan depå och leverantör som räknas som likvärdig när ett ledigt tåg väljs.
ltn-depot-stop-limit-trains=[font=default-semibold][color=red][EXPERIMENTELLT!][/color][/font] Styr hur inställningen ”Tåggräns” fungerar för LTN-depåstopp.

