[mod-setting-description]
ltnc-use-stacks=När alternativet är markerat anges föremålsbeställningar i staplar i stället för i enskilda föremål.\n\n[color=blue]Standard:[/color] [color=green]Sant[/color]
ltnc-negative-signals=När alternativet är aktiverat blir nyskapade föremåls- och vätskesignaler negativa.\nHåll ned [color=blue]SHIFT[/color] för att låta värdet förbli positivt.\n\n[color=blue]Standard:[/color] [color=green]Sant[/color]
ltnc-emit-default-network-id=När alternativet är aktiverat tas ett nätverks-ID som motsvarar LTN:s standardnätverks-ID inte bort från kombinatorn.\n\n[color=blue]Standard:[/color] [color=green]Falskt[/color]
ltnc-emit-explicit-default=När alternativet är aktiverat kan du ange en signal som motsvarar LTN:s standardvärde. Den tas inte bort från kombinatorn om LTN:s standardvärde ändras.\n\n[color=blue]Standard:[/color] [color=green]Falskt[/color]
ltnc-misc-signal-rows=Antal tillgängliga rader för styrsignaler som inte tillhör LTN.\n\n[color=blue]Standard:[/color] [color=green]2[/color]
ltnc-high-threshold=Tröskelvärde som anges när beställaren eller leverantören inaktiveras.\n\n[color=blue]Standard:[/color] [color=green]2,147,483,647[/color]
ltnc-disable-built-combinators=Utplacerade LTN-kombinatorer får de valda funktionerna inaktiverade.\nDetta gäller nya och kopierade kombinatorer samt kombinatorer byggda från planritningar.\n\n[color=blue]Standard:[/color] [color=green]Inaktivera beställare[/color]
ltnc-alert-build-disable=Skapa en varning när nya kombinatorer placeras ut och tvingas vara avstängda eller får funktioner inaktiverade av inställningen ovan.\n\n[color=blue]Standard:[/color] [color=green]true[/color]
ltnc-show-net-panel=Visa konfigurationspanelen för nätverks-ID som standard i stället för förhandsvisningen av objektet.\n\n[color=blue]Standard:[/color] [color=green]Falskt[/color]
#ltnc-upgradable=Räknas som en uppgraderad nivå av konstantkombinatorn. En standardplan för uppgradering markerar konstantkombinatorer för uppgradering till LTN-kombinatorer.\n\nDetta påverkar inte snabbuppgradering.\n\n[color=blue]Standard:[/color] [color=green]Falskt[/color]
#ltnc-slider-max-items=Det största antal föremål (staplar) som kan beställas med reglaget. Större värden kan fortfarande anges direkt.\n\n[color=blue]Standard:[/color] [color=green]256[/color]
#ltnc-slider-max-fluid=Den största mängd vätska som kan beställas med reglaget. Större värden kan fortfarande anges direkt.\n\n[color=blue]Standard:[/color] [color=green]500k[/color]

[string-mod-setting]
ltnc-disable-built-combinators-none=Ingen inaktiverad
ltnc-disable-built-combinators-requester=Inaktivera beställare
ltnc-disable-built-combinators-provider=Inaktivera leverantör
ltnc-disable-built-combinators-all=Båda inaktiverade
ltnc-disable-built-combinators-off=Avstängd

[string-mod-setting-description]
ltnc-disable-built-combinators-none=Varken beställar- eller leverantörsfunktionen tvingas till ett inaktiverat läge. Båda funktionerna förblir aktiverade på nya kombinatorer.\n\n[color=red]Obs![/color] När en kombinator byggs från en planritning eller kopieras behåller funktionerna läget från planritningen eller ursprungsobjektet.
ltnc-disable-built-combinators-requester=Beställarfunktionen inaktiveras på alla nya kombinatorer. Detta inaktiverar beställarfunktionen även på kombinatorer byggda från planritningar där den är aktiverad.\n\n[color=red]Obs![/color] Inaktivering innebär att en hög beställningströskel anges på kombinatorn.
ltnc-disable-built-combinators-provider=Leverantörsfunktionen inaktiveras på alla nya kombinatorer. Detta inaktiverar leverantörsfunktionen även på kombinatorer byggda från planritningar där den är aktiverad.\n\n[color=red]Obs![/color] Inaktivering innebär att en hög leverantörströskel anges på kombinatorn.
ltnc-disable-built-combinators-all=Både beställar- och leverantörsfunktionen tvingas till ett inaktiverat läge. Detta åsidosätter inställningarna i kombinatorer byggda från planritningar.\n\n[color=red]Obs![/color] Inaktivering innebär att höga beställnings- och leverantörströsklar anges på kombinatorn.
ltnc-disable-built-combinators-off=Kombinatorer placeras ut i avstängt läge. Tröskelvärdena ändras inte.


